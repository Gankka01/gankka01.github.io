<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body id="top" class="bg-surface text-text font-serif antialiased print:bg-white">
  {% assign lang = page.lang | default: 'en' %}{% assign ui = site.data.i18n[lang] %}
  <a class="skip-link no-print" href="#main-content">{{ ui.skip | escape }}</a>
  {% include header.html %}
  <main id="main-content" class="cv max-w-4xl mx-auto px-6 py-8 print:py-4 print:px-4" tabindex="-1">
    {{ content }}
    {% include back-to-top.html %}
  </main>
  {% include footer.html %}
</body>
</html>
