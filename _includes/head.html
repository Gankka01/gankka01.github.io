{% assign lang = page.lang | default: 'en' %}
{% assign ui = site.data.i18n[lang] %}
{% if page.page_id == 'cv' %}{% assign en_url = '/cv/' %}{% assign ko_url = '/ko/cv/' %}{% else %}{% assign en_url = '/' %}{% assign ko_url = '/ko/' %}{% endif %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: ui.description | strip_html | normalize_whitespace | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ en_url | absolute_url }}">
<link rel="alternate" hreflang="ko" href="{{ ko_url | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ en_url | absolute_url }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}?v=wonik-1" sizes="16x16 32x32 48x48">
<link rel="icon" href="{{ '/assets/icons/favicon.svg' | relative_url }}?v=wonik-1" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}?v=wonik-1" sizes="180x180">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: ui.description | strip_html | normalize_whitespace | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:locale" content="{% if lang == 'ko' %}ko_KR{% else %}en_US{% endif %}">
<meta property="og:image" content="{{ '/assets/images/wonik-share.png' | absolute_url }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ ui.logo_alt | escape }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Nanum+Gothic:wght@400;700;800&family=Noto+Serif+KR:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
<script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
