<footer class="py-12 no-print">
  <div class="max-w-4xl mx-auto px-6 text-center">
    <div class="flex justify-center items-center gap-5 mb-4">
      <a href="mailto:{{ site.email | escape }}" class="no-underline" aria-label="Email {{ site.name | escape }}">{% include icons/envelope.html class="w-5 h-5" %}</a>
      <a href="https://github.com/{{ site.github_username }}" class="no-underline" aria-label="{{ site.name | escape }} on GitHub">{% include icons/github.html class="w-5 h-5" %}</a>
      <a href="https://scholar.google.com/citations?user={{ site.google_scholar }}" class="no-underline" aria-label="{{ site.name | escape }} on Google Scholar"><i class="ai ai-google-scholar text-xl" aria-hidden="true"></i></a>
    </div>
    <p class="font-sans text-xs text-text-muted leading-relaxed">
      Template adapted from <a href="https://github.com/keunhong/keunhong.github.io">Keunhong Park</a>.
      Thanks for sharing! · <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="license">CC BY-SA 4.0</a>
    </p>
  </div>
</footer>
