{% if page.lang == 'ko' %}{% assign accent_length = 1 %}{% else %}{% assign accent_length = 3 %}{% endif %}
<h2 id="{{ include.id | escape }}" class="cv-section-title font-display text-3xl font-semibold text-text mb-4"><span class="cv-section-label"><span class="text-accent">{{ include.title | slice: 0, accent_length | escape }}</span>{{ include.title | slice: accent_length, 200 | escape }}</span></h2>
