    institution: Kangnam University
    institution_ko: 강남대학교
    dates: "2023"
    dates_ko: 2023년
    details:
      - text: Developed video analysis and deep learning classifiers for lost-dog matching.
        text_ko: 실종견 매칭을 위한 영상 분석 및 딥러닝 분류 모델을 개발했습니다.
      - text: The team earned an Encouragement Award at the 2023 Data Youth Campus competition.
        text_ko: 2023 데이터 청년 캠퍼스 경진대회에서 팀 장려상을 수상했습니다.
